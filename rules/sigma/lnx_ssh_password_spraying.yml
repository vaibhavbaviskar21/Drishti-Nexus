title: SSH Password Spraying or User Enumeration From One Source
id: 9a4c7e21-3b5d-4f68-8c0e-6d2f1a9b4e55
status: experimental
description: |
  One source IP tried more than 4 different account names over SSH within 10
  minutes (failed passwords or invalid users). Password guessing against a single
  account is covered by the built-in brute-force rules; this catches the wide,
  shallow pattern of spraying and username enumeration.
references:
  - https://attack.mitre.org/techniques/T1110/003/
author: Drishti Nexus
date: 2026/11/20
tags:
  - attack.credential_access
  - attack.t1110.003
logsource:
  product: linux
  service: sshd
detection:
  keywords:
    - 'Failed password for'
    - 'Invalid user'
  timeframe: 10m
  condition: keywords | count(user) by src_ip > 4
falsepositives:
  - A jump host or NAT gateway where several real users mistype passwords at once
level: high
