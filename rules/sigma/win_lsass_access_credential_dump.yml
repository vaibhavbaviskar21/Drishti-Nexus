title: LSASS Memory Read With Credential-Dumping Access Rights
id: 0b9e8a7c-5d4f-4c3b-8a2e-1f6d9c0b7a22
status: experimental
description: |
  A process opened lsass.exe with the access masks used by Mimikatz-style
  credential dumping (PROCESS_VM_READ with query rights). Antivirus scanners are excluded.
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: Drishti Nexus
date: 2026/11/01
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  product: windows
  category: process_access
detection:
  selection:
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess:
      - '0x1010'
      - '0x1410'
      - '0x1418'
      - '0x1438'
      - '0x143a'
      - '0x1fffff'
  filter_av:
    SourceImage|endswith:
      - '\MsMpEng.exe'
      - '\MsSense.exe'
  condition: selection and not filter_av
falsepositives:
  - Other security products that scan LSASS
level: high
