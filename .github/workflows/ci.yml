name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Build
        run: go build ./...
      - name: Generate benign dataset
        run: go run ./cmd/genbenign
      - name: Cache public datasets
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: testdata/datasets/.cache
          key: datasets-${{ hashFiles('scripts/fetch-datasets.sh') }}
      - name: Fetch public datasets
        if: runner.os == 'Linux'
        run: bash scripts/fetch-datasets.sh
      - name: Unit + integration tests
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...
      - name: Unit tests (fixtures only)
        if: runner.os != 'Linux'
        run: go test -short -count=1 ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.8
          gosec -conf .gosec.json ./...

  docker:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t drishti-nexus:ci .
      - name: Smoke test (read-only evidence mount)
        run: |
          mkdir -p out
          docker run --rm drishti-nexus:ci version
          docker run --rm --read-only -v "$PWD/testdata/fixtures:/evidence:ro" -v "$PWD/out:/out" --user "$(id -u):$(id -g)" \
            drishti-nexus:ci scan -parsers /etc/drishti/parsers -audit-log /out/audit.log -output /out/report.json /evidence/multihost
          test -s out/report.json
